name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Unit tests
        run: uv run --frozen pytest -m "not integration"
      - name: Integration tests (real git, Graphify and MCP under a disposable HOME)
        run: uv run --frozen pytest -m integration
